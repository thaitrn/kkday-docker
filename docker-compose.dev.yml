services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80;https://+:443
    volumes:
      # Mount source code for hot reload
      - ./KKday.B2D.Web.InternAgent:/app/KKday.B2D.Web.InternAgent:cached
      # Exclude bin/obj to avoid conflicts
      - /app/KKday.B2D.Web.InternAgent/bin
      - /app/KKday.B2D.Web.InternAgent/obj
    # Override for development - no restart
    restart: "no"
    stdin_open: true
    tty: true
